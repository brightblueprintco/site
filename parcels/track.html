<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Track your parcel</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F2F4F7;color:#1B2230}
.hd{background:var(--c,#2E5BBA);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 26px}
.lg{font-weight:800;letter-spacing:.02em;font-size:20px}.lg span{opacity:.7;font-weight:500;font-size:13px;margin-left:8px;letter-spacing:0}
.hd h1{margin:18px 0 4px;font-size:26px;line-height:1.15}.hd p{margin:0;opacity:.85;font-size:14px}
.wrap{padding:16px;max-width:560px;margin:-14px auto 0}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.big{display:flex;justify-content:space-between;gap:12px}.big b{font-size:22px;display:block}.lab{font-size:12px;color:#6B7385;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tl{list-style:none;margin:0;padding:0}.tl li{position:relative;padding:0 0 18px 30px}.tl li:last-child{padding-bottom:0}
.tl li:before{content:"";position:absolute;left:6px;top:6px;width:12px;height:12px;border-radius:50%;background:#CBD2DE}
.tl li:after{content:"";position:absolute;left:11px;top:20px;bottom:-4px;width:2px;background:#E3E7EE}.tl li:last-child:after{display:none}
.tl li.d:before{background:var(--c,#2E5BBA)}.tl li.now:before{background:#fff;border:3px solid var(--c,#2E5BBA);width:14px;height:14px;left:5px;top:5px}
.tl b{display:block}.tl span{font-size:13.5px;color:#6B7385}
.bar{height:8px;border-radius:4px;background:#E3E7EE;margin:14px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c,#2E5BBA);border-radius:4px}
.btn{display:block;text-align:center;background:#1B2230;color:#fff;border-radius:12px;padding:14px;font-weight:600;text-decoration:none;margin-top:6px}
.note{text-align:center;font-size:12px;color:#8A92A3;margin:14px 0 30px}
</style></head><body>
<div class="hd" id="hd"><div class="lg" id="lg"></div><h1 id="h1">Your parcel</h1><p id="sub"></p></div>
<div class="wrap">
<div class="card"><div class="big"><div><div class="lab">Expected</div><b id="due"></b></div><div style="text-align:right"><div class="lab">Window</div><b id="win" style="font-size:17px"></b></div></div><div class="bar"><i id="bar"></i></div><span class="lab" id="stat"></span></div>
<div class="card"><div class="lab" style="margin-bottom:12px">Tracking history</div><ul class="tl" id="tl"></ul></div>
<a class="btn" href="javascript:history.back()">Back to my parcels</a>
<p class="note">Sample tracking page for demo purposes.</p>
</div>
<script>
var q=new URLSearchParams(location.search),c=q.get("c")||"ParcelCo",n=(q.get("n")||"").toUpperCase(),o=null;
try{(JSON.parse(localStorage.getItem("bb-parcels-demo"))||{orders:[]}).orders.forEach(function(x){if(String(x.track).toUpperCase()===n)o=x})}catch(e){}
var col={ParcelCo:"#2E5BBA",SwiftPost:"#C2410C",Northway:"#0F766E"}[c]||"#2E5BBA";document.documentElement.style.setProperty("--c",col);
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function add(s,k){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+k);return iso(d)}
function f(s){return new Date(s+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"})}
var t=iso(new Date()),due=o&&o.due||add(t,1),dd=Math.round((new Date(due+"T00:00:00")-new Date(t+"T00:00:00"))/864e5);
document.getElementById("lg").innerHTML=c.toUpperCase()+"<span>tracking</span>";
document.getElementById("h1").textContent=o&&o.from?"Your parcel from "+o.from:"Your parcel";
document.getElementById("sub").textContent=(o&&o.item?o.item+" · ":"")+n;
document.getElementById("due").textContent=dd===0?"Today":dd===1?"Tomorrow":f(due);
document.getElementById("win").textContent=["8:00–12:00","10:00–14:00","12:00–16:00"][n.charCodeAt(n.length-1)%3];
var st=dd<=0?3:dd===1?2:1;document.getElementById("bar").style.width=[0,45,70,90][st]+"%";
document.getElementById("stat").textContent=dd<0?"Running late, sorry!":["","In transit","At your local depot","Out for delivery"][st];
var ev=[["Order received from "+((o&&o.from)||"the seller"),add(due,-4)+" 09:12"],["Collected by "+c,add(due,-3)+" 17:40"],["In transit to your local depot",add(due,-2)+" 03:55"]];
if(st>=2)ev.push(["Arrived at your local depot",add(due,-1)+" 22:18"]);if(st>=3)ev.push(["Out for delivery with your driver",(dd<0?t:due)+" 07:31"]);
document.getElementById("tl").innerHTML=ev.reverse().map(function(e,i){var p=e[1].split(" ");return '<li class="'+(i===0?"now":"d")+'"><b>'+e[0]+'</b><span>'+f(p[0])+", "+p[1]+'</span></li>'}).join("");
</script></body></html>
